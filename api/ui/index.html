<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script>try{var t=localStorage.getItem("crm_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;var a=localStorage.getItem("crm_accent");if(a&&/^[a-z]+$/.test(a)&&a!=="green")document.documentElement.dataset.accent=a}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
