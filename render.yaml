# Render blueprint: tells Render how to run the CRM. Secrets are filled in on the Render page, never stored here.
services:
  - type: web
    name: crm
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SANDBOX_TENANT_ID
        sync: false
